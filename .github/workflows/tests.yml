name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tool tests need no LLM, so we only install what they import.
      - run: pip install pydantic==2.14.1 pytest==9.1.1
      - run: pytest -v
